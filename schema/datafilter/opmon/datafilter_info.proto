syntax = "proto3";

package dunedaq.datafilter.opmon;

message DataFilterInfo {

  uint64 total_amount = 1;
  uint32 amount_since_last_call = 2;

  // NOTE: the accept/reject ADC histograms are NOT published here.
  // opmonlib's OpMonValue (opmon_entry.proto) only supports scalar types
  // (int/uint/double/float/bool/string) -- repeated fields are silently
  // dropped by the reflection-based Message -> OpMonEntry conversion
  // ("all other types are neglected", per that proto's own comment).
  // DataFilter writes the histograms directly to its own JSON file instead
  // -- see DataFilter::generate_opmon_data() and opmon_to_influx.py.

}

